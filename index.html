<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartExpense</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💸</text></svg>">
    <!-- Fallback for browsers with JS disabled -->
    <noscript><meta http-equiv="refresh" content="0; url=login.html"></noscript>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background:
                radial-gradient(900px 500px at 15% -10%, #eff6ff, transparent),
                radial-gradient(900px 500px at 110% 10%, #f5f3ff, transparent),
                #f5f7fb;
        }
        .splash {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
        }
        .logo {
            width: 52px;
            height: 52px;
            display: grid;
            place-items: center;
            border-radius: 15px;
            color: #fff;
            font-weight: 700;
            font-size: 22px;
            background: linear-gradient(135deg, #2563eb, #7c3aed);
            box-shadow: 0 10px 30px rgba(37, 99, 235, 0.25);
            animation: pulse 1.4s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.06); }
        }
        .splash p {
            font-size: 13px;
            color: #64748b;
        }
    </style>
    <script>
        (function () {
            var user = localStorage.getItem("smartExpenseCurrentUser");
            window.location.replace(user ? "dashboard.html" : "login.html");
        })();
    </script>
</head>
<body>
    <div class="splash">
        <div class="logo">₹</div>
        <p>Loading SmartExpense…</p>
    </div>
</body>
</html>
