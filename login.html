<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | SmartExpense</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💸</text></svg>">
    <link rel="stylesheet" href="theme.css">
    <link rel="stylesheet" href="login.css">
    <script>
        (function () {
            var t = localStorage.getItem("smartExpenseTheme");
            if (t === "dark") document.documentElement.setAttribute("data-theme", "dark");
        })();
    </script>
</head>
<body>
<button class="icon-btn theme-toggle auth-theme-toggle" id="themeToggle" type="button" aria-label="Toggle dark mode">
    <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
</button>
<div class="login-page">
    <div class="login-card">
       <div class="logo">₹</div>
        <h1>SmartExpense</h1>
        <p class="subtitle">
            Manage your money smarter
        </p>
        <form id="loginForm">
            <label>Email</label>
            <input
                type="email"
                id="loginEmail"
                placeholder="Enter your email"
                required
            >
            <label>Password</label>
            <input
                type="password"
                id="loginPassword"
                placeholder="Enter your password"
                required
            >
            <p id="loginMessage"></p>
            <button type="submit" class="btn" style="width:100%;">
                Login
            </button>
        </form>
        <p class="signup-link">
            Don't have an account?
            <a href="signup.html">Create account</a>
        </p>
    </div>
</div>
<script src="shared.js"></script>
<script src="auth.js"></script>
</body>
</html>
